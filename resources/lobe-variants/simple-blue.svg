  <title id="title">Image — Lobe Blue icon</title>
  <desc id="desc">Two distinct lobe blue mountains with compact white snowcaps and a round moon on a deep green background, enclosed in a white rounded square frame. A fine inset outline preserves the frame on light backgrounds. Everything beyond the frame is transparent. Flat vector colors without gradients, glow, glass, or northern lights.</desc>
