[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "galimvmini"
version = "1.0.0"
description = "Lightweight AI Image Metadata Inspector & Gallery in the spirit of galIMV"
authors = [{ name = "galIMV Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.5.0",
    "Pillow>=10.0.0",
    "pyperclip>=1.8.0",
]

[project.scripts]
galimvmini = "galIMVmini.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["galIMVmini*"]
